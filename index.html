<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Photo Gallery</title>
  <style>
    body { margin: 20px; font-family: sans-serif; }
    #image {
      width: 575px;
      height: 300px;
      border: 5px solid black;
      background-color: #8e8e8e;
      background-repeat: no-repeat;
      background-size: cover;
      color: #FFFFFF;
      text-align: center;
      line-height: 300px;
      font-size: 150%;
      margin-bottom: 25px;
    }
    .preview {
      width: 100px;
      height: 100px;
      border: 10px solid black;
      margin: 10px;
    }
  </style>
  <script src="script.js" defer></script>
</head>
<body>

  <div id="image">
    Hover over an image below to display here.
  </div>

 <img class="preview" 
     alt="Stylized Landscape" 
     src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=300" 
     onmouseover="upDate(this)" 
     onmouseout="unDo()">

<img class="preview" 
     alt="Cute Puppy" 
     src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=300" 
     onmouseover="upDate(this)" 
     onmouseout="unDo()">

<img class="preview" 
     alt="Bright Sunflowers" 
     src="https://images.unsplash.com/photo-1597848212624-a19eb35e2651?w=300" 
     onmouseover="upDate(this)" 
     onmouseout="unDo()">

</body>
</html>
